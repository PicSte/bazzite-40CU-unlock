name: Lint

on:
  push:
    paths: ['**.sh', '.github/workflows/lint.yml']
  pull_request:
    paths: ['**.sh', '.github/workflows/lint.yml']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck bc250-setup.sh build_files/*.sh
